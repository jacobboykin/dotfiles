---
# Install Mac App Store applications via mas
# Requires the user to be signed in to the Mac App Store

- name: Check if mas is installed
  command: which mas
  register: mas_check
  changed_when: false
  failed_when: false
  become: no

- name: Install mas (Mac App Store CLI)
  community.general.homebrew:
    name: mas
    state: present
  become: no
  when: mas_check.rc != 0

- name: Check if signed in to Mac App Store (attempt mas account)
  command: mas account
  register: mas_account_check
  changed_when: false
  failed_when: false
  become: no

- name: Check App Store sign-in via alternative method
  shell: defaults read MobileMeAccounts Accounts 2>/dev/null | grep -q AccountID
  register: appstore_signed_in_check
  changed_when: false
  failed_when: false
  become: no
  when: mas_account_check.rc != 0

- name: Set Mac App Store sign-in status
  set_fact:
    mas_signed_in: "{{ mas_account_check.rc == 0 or (appstore_signed_in_check.rc is defined and appstore_signed_in_check.rc == 0) }}"

- name: Display Mac App Store login status
  debug:
    msg: |
      ⚠️  Not signed in to Mac App Store!
      
      Note: On macOS 12+, 'mas account' command is no longer supported.
      Please ensure you're signed in to the App Store via System Settings.
      
      To verify: Open App Store app → Check if you see your account in the sidebar
      
      Skipping Mac App Store app installations...
  when: not mas_signed_in

- name: Read Mac App Store apps from file
  slurp:
    src: "{{ dotfiles_dir }}/mas-apps.txt"
  register: mas_apps_file
  when: mas_signed_in
  become: no

- name: Parse Mac App Store app IDs (filter comments and empty lines)
  set_fact:
    mas_apps: "{{ mas_apps_file.content | b64decode | split('\n') | select('match', '^[0-9]') | map('trim') | map('regex_replace', '\\s+#.*$', '') | list }}"
  when: mas_signed_in

- name: Install Mac App Store applications
  command: mas install {{ item }}
  loop: "{{ mas_apps | default([]) }}"
  register: mas_install_result
  changed_when: "'Installed' in mas_install_result.stdout"
  failed_when: false
  become: no
  when: mas_signed_in and mas_apps | length > 0
  loop_control:
    label: "App ID {{ item }}"

