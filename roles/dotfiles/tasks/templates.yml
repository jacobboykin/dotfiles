---
# Process template files (.symlink.j2) and render them to .symlink files
# This allows sensitive data to be templated from environment variables or secrets files

- name: Find all template files
  find:
    paths: "{{ dotfiles_dir }}"
    patterns: "*.symlink.j2"
    recurse: yes
  register: template_files
  become: no

- name: Render template files
  become: no
  template:
    src: "{{ item.path }}"
    dest: "{{ item.path | regex_replace('\\.j2$', '') }}"
    mode: '0600'
  loop: "{{ template_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: template_files.files | length > 0
  no_log: true
  diff: no

